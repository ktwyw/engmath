[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engmath"
version = "0.1.0"
description = "Engineering mathematics with Python: readable from-scratch numerical methods, validated against SciPy, with a notebook course."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yanwei Wang", email = "wangyanwei@gmail.com" }]
keywords = ["numerical methods", "engineering mathematics", "education", "root finding", "interpolation",
            "numerical integration", "differential equations", "curve fitting", "jupyter", "sympy", "fft",
            "linear programming", "monte carlo", "sparse matrices", "boundary value problems"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.7", "jupyterlab>=4", "sympy>=1.12", "pandas>=1.5"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7", "statsmodels>=0.14", "nbformat>=5", "nbclient>=0.9",
       "ipykernel>=6", "sympy>=1.12", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/ktwyw/engmath"
Issues = "https://github.com/ktwyw/engmath/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engmath = ["data/*.csv", "data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/engmath"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks/*.ipynb", "solutions/*.ipynb"]  # generated by the build scripts

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B023", "E402", "B905"]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501", "E702"]  # notebook code favours compact plotting lines
"docs/validate.py" = ["E501"]  # one check per line reads like a table
"solutions/build_solutions.py" = ["E501", "E702"]  # notebook code favours compact lines
